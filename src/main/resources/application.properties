spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcampus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartcampus}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.sql.init.mode=always
jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-use}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
